# Render Blueprint — https://render.com/docs/blueprint-spec
# If you created the service manually, set in Dashboard → Settings → Build & Deploy:
#   Root Directory: (leave empty)
#   Dockerfile Path: Dockerfile

services:
  - type: web
    name: dppflash-backend
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_DPP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPPLIER_OUTREACH_SECRET
        sync: false
      - key: SUPPLIER_OUTREACH_ENABLED
        value: "false"
      - key: SUPPLIER_OUTREACH_FROM
        sync: false
      # IONOS Mail: smtp.ionos.de, Port 465 SSL/TLS (or 587 + STARTTLS).
      # SUPPLIER_OUTREACH_FROM must use the SAME domain as SMTP_USER (IONOS policy).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USE_SSL
        value: "true"
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
